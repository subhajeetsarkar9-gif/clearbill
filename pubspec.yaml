name: clearbill
description: "GST Invoice Manager App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.3
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0
  http: ^1.2.0
  provider: ^6.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  image_picker: ^1.0.7
  fl_chart: ^0.65.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  flutter_local_notifications: ^16.3.2
  razorpay_flutter: ^1.3.6
  go_router: ^13.2.0
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/O1.png
    - assets/O2.png
    - assets/O3.png
    - assets/logo.png
    - assets/icon.png
